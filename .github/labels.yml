# Synced to GitHub by .github/workflows/labels.yml on every push to main.
- name: bug
  color: d73a4a
  description: Something isn't working

- name: feature
  color: a2eeef
  description: New functionality

- name: refactor
  color: fbca04
  description: Code change with no behavior change

- name: docs
  color: 0075ca
  description: Documentation only

- name: chore
  color: cfd3d7
  description: Maintenance, tooling, deps
