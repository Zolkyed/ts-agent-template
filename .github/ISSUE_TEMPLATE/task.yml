name: Task
description: Maintenance, tooling, or chore work that isn't a bug or a feature
labels: [chore]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now?
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: false
